name: Public tool release gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify withdrawn tool and preserved discovery scope
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          for name in ['structural-drift-tool.html','structural-drift-tool-ja.html']:
              t=pathlib.Path(name).read_text()
              assert 'content="noindex,follow"' in t
              assert '<script' not in t and '<form' not in t and '<select' not in t
          for name in ['index.md','index_ja.md','README.md','sitemap.xml','sitemap.txt']:
              assert 'structural-drift-tool' not in pathlib.Path(name).read_text(), name
          u=[x.text for x in E.parse('sitemap.xml').getroot().findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          t=pathlib.Path('sitemap.txt').read_text().split()
          assert len(u)==len(set(u)) and set(u)==set(t)
          assert 'https://api.indexnow.org/indexnow' not in pathlib.Path('.github/workflows/public-updates.yml').read_text()
          print('Tool withdrawal and paused automatic notification: PASS; sitemap parity:',len(u))
          PY
